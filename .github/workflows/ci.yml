name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift test
      - run: ./scripts/check-no-secrets.sh

  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build-app.sh
      - run: ./scripts/check-no-secrets.sh
